<!doctype html><html lang="en"><head><meta charset="utf-8">
<!-- Иконка и заставка «Warfare 1347»: рисуются кодом, выгружает их dev/store-brand.cjs -->
<style>body { margin: 0; background: #555; } canvas { margin: 8px; }</style></head>
<body>
<script type="module">
import '@fontsource/ruslan-display/latin-400.css';
import '@fontsource/kurale/latin-400.css';

const TAU = Math.PI * 2;

/** Фон иконки: тёплая тьма с золотистым сиянием и лучами. */
function background(ctx, s) {
  const g = ctx.createRadialGradient(s * 0.5, s * 0.42, s * 0.05, s * 0.5, s * 0.5, s * 0.75);
  g.addColorStop(0, '#6a3f22');
  g.addColorStop(0.45, '#35200f');
  g.addColorStop(1, '#130c07');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  ctx.save();
  ctx.translate(s * 0.5, s * 0.44);
  for (let i = 0; i < 24; i++) {
    ctx.rotate(TAU / 24);
    const r = ctx.createLinearGradient(0, 0, 0, -s * 0.75);
    r.addColorStop(0, 'rgba(255,200,110,0.16)');
    r.addColorStop(1, 'rgba(255,200,110,0)');
    ctx.fillStyle = r;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-s * 0.035, -s * 0.8);
    ctx.lineTo(s * 0.035, -s * 0.8);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

/** Меч остриём вверх; ось — от (0,0) до (0,-len). */
function sword(ctx, len) {
  const w = len * 0.075;
  const OUT = '#1b0f07';
  ctx.lineJoin = 'round';
  ctx.lineWidth = len * 0.018;
  ctx.strokeStyle = OUT;
  // клинок
  const blade = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
  blade.addColorStop(0, '#8b97a6');
  blade.addColorStop(0.45, '#f4f7fb');
  blade.addColorStop(0.55, '#cfd7e2');
  blade.addColorStop(1, '#6d7888');
  ctx.beginPath();
  ctx.moveTo(-w / 2, -len * 0.3);
  ctx.lineTo(-w / 2, -len * 0.9);
  ctx.lineTo(0, -len);
  ctx.lineTo(w / 2, -len * 0.9);
  ctx.lineTo(w / 2, -len * 0.3);
  ctx.closePath();
  ctx.fillStyle = blade;
  ctx.fill();
  ctx.stroke();
  // дол
  ctx.strokeStyle = 'rgba(70,82,98,0.7)';
  ctx.lineWidth = len * 0.01;
  ctx.beginPath();
  ctx.moveTo(0, -len * 0.33);
  ctx.lineTo(0, -len * 0.85);
  ctx.stroke();
  const gold = (x0, x1) => {
    const g = ctx.createLinearGradient(x0, 0, x1, 0);
    g.addColorStop(0, '#8a5a12');
    g.addColorStop(0.5, '#ffe08a');
    g.addColorStop(1, '#a8701a');
    return g;
  };
  ctx.strokeStyle = OUT;
  ctx.lineWidth = len * 0.018;
  // рукоять
  ctx.fillStyle = '#5a2f17';
  ctx.beginPath();
  ctx.rect(-w * 0.35, -len * 0.3, w * 0.7, len * 0.2);
  ctx.fill();
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,220,160,0.35)';
  ctx.lineWidth = len * 0.008;
  for (let i = 0; i < 4; i++) {
    const y = -len * (0.12 + i * 0.045);
    ctx.beginPath();
    ctx.moveTo(-w * 0.35, y);
    ctx.lineTo(w * 0.35, y - len * 0.02);
    ctx.stroke();
  }
  ctx.strokeStyle = OUT;
  ctx.lineWidth = len * 0.018;
  // гарда
  ctx.fillStyle = gold(-w * 2.4, w * 2.4);
  ctx.beginPath();
  ctx.moveTo(-w * 2.4, -len * 0.33);
  ctx.quadraticCurveTo(0, -len * 0.27, w * 2.4, -len * 0.33);
  ctx.lineTo(w * 2.4, -len * 0.28);
  ctx.quadraticCurveTo(0, -len * 0.23, -w * 2.4, -len * 0.28);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // навершие
  ctx.fillStyle = gold(-w * 0.7, w * 0.7);
  ctx.beginPath();
  ctx.arc(0, -len * 0.075, w * 0.62, 0, TAU);
  ctx.fill();
  ctx.stroke();
}

/** Контур геральдического щита (центр по x, верх в y0). */
function shieldPath(ctx, cx, y0, w, h) {
  const x0 = cx - w / 2, x1 = cx + w / 2;
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y0);
  ctx.lineTo(x1, y0 + h * 0.42);
  ctx.bezierCurveTo(x1, y0 + h * 0.78, cx + w * 0.18, y0 + h * 0.9, cx, y0 + h);
  ctx.bezierCurveTo(cx - w * 0.18, y0 + h * 0.9, x0, y0 + h * 0.78, x0, y0 + h * 0.42);
  ctx.closePath();
}

/** Корона на щите. */
function crown(ctx, cx, cy, w) {
  const h = w * 0.62;
  const g = ctx.createLinearGradient(0, cy - h / 2, 0, cy + h / 2);
  g.addColorStop(0, '#fff1b0');
  g.addColorStop(0.5, '#f2c14e');
  g.addColorStop(1, '#a86b14');
  ctx.fillStyle = g;
  ctx.strokeStyle = '#2a1405';
  ctx.lineWidth = w * 0.045;
  ctx.lineJoin = 'round';
  const x0 = cx - w / 2, x1 = cx + w / 2, yb = cy + h * 0.5, yt = cy - h * 0.5;
  ctx.beginPath();
  ctx.moveTo(x0, yb);
  ctx.lineTo(x0 - w * 0.04, yt + h * 0.25);
  ctx.lineTo(cx - w * 0.3, cy);
  ctx.lineTo(cx - w * 0.16, yt);
  ctx.lineTo(cx, cy - h * 0.12);
  ctx.lineTo(cx + w * 0.16, yt);
  ctx.lineTo(cx + w * 0.3, cy);
  ctx.lineTo(x1 + w * 0.04, yt + h * 0.25);
  ctx.lineTo(x1, yb);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // обруч
  ctx.beginPath();
  ctx.rect(x0, yb - h * 0.22, w, h * 0.22);
  ctx.fill();
  ctx.stroke();
  // камни
  const gem = (x, y, r, c) => {
    const gg = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
    gg.addColorStop(0, '#ffffff');
    gg.addColorStop(0.35, c);
    gg.addColorStop(1, '#200808');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
    ctx.lineWidth = r * 0.3;
    ctx.stroke();
  };
  gem(cx, yb - h * 0.11, w * 0.07, '#d8283a');
  gem(cx - w * 0.3, yb - h * 0.11, w * 0.05, '#2f7fd8');
  gem(cx + w * 0.3, yb - h * 0.11, w * 0.05, '#2f7fd8');
  for (const [x, y] of [[x0 - w * 0.04, yt + h * 0.25], [cx - w * 0.16, yt], [cx + w * 0.16, yt], [x1 + w * 0.04, yt + h * 0.25]]) gem(x, y - w * 0.02, w * 0.045, '#ffe7a0');
}

/** Герб: скрещённые мечи за щитом с короной. k — размер (ширина области). */
function emblem(ctx, cx, cy, k) {
  // мечи
  const len = k * 1.12;
  for (const a of [-0.76, 0.76]) {
    ctx.save();
    ctx.translate(cx - Math.sin(a) * len * 0.5, cy + Math.cos(a) * len * 0.5);
    ctx.rotate(a);
    sword(ctx, len);
    ctx.restore();
  }
  // тень щита
  const w = k * 0.5, h = k * 0.6, y0 = cy - h * 0.5;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = k * 0.05;
  ctx.shadowOffsetY = k * 0.02;
  shieldPath(ctx, cx, y0, w, h);
  ctx.fillStyle = '#000';
  ctx.fill();
  ctx.restore();
  // золотая кайма
  shieldPath(ctx, cx, y0, w, h);
  const rim = ctx.createLinearGradient(cx - w / 2, y0, cx + w / 2, y0 + h);
  rim.addColorStop(0, '#fff0a8');
  rim.addColorStop(0.4, '#e2a93a');
  rim.addColorStop(1, '#7c4a0c');
  ctx.fillStyle = rim;
  ctx.fill();
  ctx.lineWidth = k * 0.018;
  ctx.strokeStyle = '#1b0f07';
  ctx.stroke();
  // поле щита
  const inset = k * 0.035;
  shieldPath(ctx, cx, y0 + inset, w - inset * 2, h - inset * 2.2);
  const field = ctx.createLinearGradient(cx - w / 2, y0, cx + w / 2, y0 + h);
  field.addColorStop(0, '#d8343c');
  field.addColorStop(0.55, '#9c1d25');
  field.addColorStop(1, '#5e0d13');
  ctx.fillStyle = field;
  ctx.fill();
  // блик
  ctx.save();
  shieldPath(ctx, cx, y0 + inset, w - inset * 2, h - inset * 2.2);
  ctx.clip();
  const shine = ctx.createLinearGradient(cx - w / 2, y0, cx, y0 + h * 0.5);
  shine.addColorStop(0, 'rgba(255,255,255,0.35)');
  shine.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = shine;
  ctx.beginPath();
  ctx.ellipse(cx - w * 0.2, y0 + h * 0.12, w * 0.45, h * 0.3, -0.5, 0, TAU);
  ctx.fill();
  ctx.restore();
  crown(ctx, cx, y0 + h * 0.43, w * 0.56);
}

function canvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}

/** Полная иконка (фон + герб). round — круглая маска. */
function icon(size, round = false) {
  const c = canvas(size, size);
  const ctx = c.getContext('2d');
  if (round) {
    ctx.beginPath();
    ctx.arc(size / 2, size / 2, size / 2, 0, TAU);
    ctx.clip();
  }
  background(ctx, size);
  emblem(ctx, size * 0.5, size * 0.5, size * (round ? 0.74 : 0.8));
  return c;
}

/** Передний слой адаптивной иконки: герб в безопасной зоне (66 из 108), фон прозрачный. */
function foreground(size) {
  const c = canvas(size, size);
  emblem(c.getContext('2d'), size * 0.5, size * 0.5, size * 0.6);
  return c;
}

/** Заставка: тёмный фон, герб и название. */
function splash(w, h) {
  const c = canvas(w, h);
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(w / 2, h * 0.42, 0, w / 2, h / 2, Math.max(w, h) * 0.7);
  g.addColorStop(0, '#3a2414');
  g.addColorStop(1, '#14110f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  const m = Math.min(w, h);
  emblem(ctx, w / 2, h * 0.42, m * 0.42);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `${Math.round(m * 0.085)}px "Ruslan Display"`;
  ctx.fillStyle = '#3b2208';
  ctx.fillText('WARFARE 1347', w / 2, h * 0.42 + m * 0.33 + m * 0.008);
  const tg = ctx.createLinearGradient(0, h * 0.42 + m * 0.29, 0, h * 0.42 + m * 0.37);
  tg.addColorStop(0, '#ffe7a0');
  tg.addColorStop(1, '#d99a2b');
  ctx.fillStyle = tg;
  ctx.fillText('WARFARE 1347', w / 2, h * 0.42 + m * 0.33);
  return c;
}

window.__brand = { icon, foreground, splash, emblem, background };
await document.fonts.load('40px "Ruslan Display"', 'WARFARE 1347');
const preview = [icon(256), icon(96, true), foreground(162), splash(480, 320)];
for (const p of preview) document.body.append(p);
window.__ready = true;
</script>
</body></html>
