<!doctype html><html><head><meta charset="utf-8"></head><body style="background:#8a9a60;margin:8px;font:12px sans-serif">
<script type="module">
import { drawUnitSheet } from '/src/gfx/units.ts';
import { troopLook } from '/src/battle/looks.ts';
import { TROOPS } from '/src/data/troops.ts';
const q = new URLSearchParams(location.search);
const ids = q.get('ids')?.split(',') ?? Object.keys(TROOPS);
const s = +(q.get('s') ?? 1);
const frames = q.get('f') ? q.get('f').split(',').map(Number) : null;
const t0 = performance.now();
for (const id of ids) {
  if (!TROOPS[id]) continue;
  const c = drawUnitSheet(troopLook(TROOPS[id]));
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;align-items:center;gap:6px';
  const lab = document.createElement('span'); lab.textContent = id; lab.style.width = '90px'; row.append(lab);
  if (frames) {
    for (const f of frames) { const cc = document.createElement('canvas'); cc.width = 112; cc.height = 104; cc.getContext('2d').drawImage(c, f * 112, 0, 112, 104, 0, 0, 112, 104); cc.style.cssText = `width:${112*s}px;image-rendering:pixelated`; row.append(cc); }
  } else { c.style.cssText = `width:${c.width*s}px;image-rendering:pixelated`; row.append(c); }
  document.body.append(row);
}
window.__ms = performance.now() - t0;
window.__done = true;
</script></body></html>
