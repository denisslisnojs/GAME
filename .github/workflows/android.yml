name: Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build web version
        run: npm run build

      - name: Create and sync Capacitor Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          node scripts/android-setup.mjs
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk warfare-1347-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: warfare-1347-apk
          path: warfare-1347-debug.apk
          if-no-files-found: error
